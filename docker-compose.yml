# Base services (postgres/redis). Overlay with docker-compose.dev.yml or prod.
#
# Red compartida isp_net: API ↔ VPN gateway ↔ túneles 10.69/16 / LAN OLT-ONU.

networks:
  isp_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.10.0/24

services:
  postgres:
    image: postgres:16-alpine
    container_name: isp-control-db
    restart: unless-stopped
    networks: [isp_net]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-isp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-isp}
      POSTGRES_DB: ${POSTGRES_DB:-isp_control}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-isp} -d ${POSTGRES_DB:-isp_control}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: isp-control-redis
    restart: unless-stopped
    networks: [isp_net]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
  redis_data:
  wa_sessions_data:
