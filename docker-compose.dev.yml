# Full stack for local development (hot reload)
# Usage: docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build

services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile.dev
    container_name: isp-control-api
    restart: unless-stopped
    networks:
      isp_net:
        ipv4_address: 172.28.10.10
    cap_add:
      - NET_ADMIN
    env_file:
      - .env
    environment:
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USER: ${POSTGRES_USER:-isp}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-isp}
      DATABASE_NAME: ${POSTGRES_DB:-isp_control}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      PORT: 3000
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173,http://localhost
      NODE_ENV: development
      WHATSAPP_BAILEYS_URL: http://whatsapp-baileys:3101
      WHATSAPP_BAILEYS_SECRET: ${WHATSAPP_BAILEYS_SECRET:-dev-wa-secret-change-me}
      # Lab GenieACS NBI (lab-vpnacs netns)
      TR069_NBI_URL: ${TR069_NBI_URL:-http://lab-vpnacs:7557}
      TR069_ACS_PROBE_HOST: ${TR069_ACS_PROBE_HOST:-lab-vpnacs}
      # Rutas Docker → lab VPN gateway (OLT/ONU/router vía túnel)
      VPN_ROUTE_GATEWAY_HOST: ${VPN_ROUTE_GATEWAY_HOST:-lab-vpnacs}
      VPN_ROUTE_GATEWAY_IP: ${VPN_ROUTE_GATEWAY_IP:-172.28.10.20}
      VPN_TUNNEL_CIDR: ${VPN_TUNNEL_CIDR:-10.69.0.0/16}
      VPN_RUNTIME_STATUS_DIR: /vpn-runtime
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "3000:3000"
    volumes:
      - ./apps/api/src:/app/apps/api/src
      - ./apps/api/tsconfig.json:/app/apps/api/tsconfig.json
      - ./apps/api/nest-cli.json:/app/apps/api/nest-cli.json
      - ./deploy/vpn-routes/install-routes.sh:/vpn-routes/install-routes.sh:ro
      - ./deploy/lab-tr069/ovpn:/vpn-runtime:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile.dev
    container_name: isp-control-web
    restart: unless-stopped
    networks: [isp_net]
    environment:
      # Relativo: el navegador llama al mismo host:5173/api → proxy Vite (LAN OK)
      VITE_API_URL: /api
      VITE_DEV_API_PROXY: http://api:3000
    ports:
      - "5173:5173"
    volumes:
      - ./apps/web/src:/app/apps/web/src
      - ./apps/web/public:/app/apps/web/public
      - ./apps/web/index.html:/app/apps/web/index.html
      - ./apps/web/vite.config.ts:/app/apps/web/vite.config.ts
      - ./apps/web/tsconfig.json:/app/apps/web/tsconfig.json
      - ./apps/web/tsconfig.app.json:/app/apps/web/tsconfig.app.json
      - ./apps/web/tsconfig.node.json:/app/apps/web/tsconfig.node.json
    depends_on:
      - api

  landing:
    build:
      context: .
      dockerfile: apps/landing/Dockerfile
    container_name: isp-control-landing
    restart: unless-stopped
    networks: [isp_net]
    ports:
      - "${LANDING_PORT:-3040}:80"
    environment:
      PANEL_URL: ${PANEL_URL:-http://localhost:5173}
      API_PUBLIC_URL: ${API_PUBLIC_URL:-/api}
      CONTACT_EMAIL: ${CONTACT_EMAIL:-hola@ispcontrol.ai}
      REGISTER_URL: ${REGISTER_URL:-}
    volumes:
      - ./apps/landing/public:/usr/share/nginx/html
    depends_on:
      - api

  seed:
    build:
      context: .
      dockerfile: apps/api/Dockerfile.dev
    container_name: isp-control-seed
    profiles: ["seed"]
    networks: [isp_net]
    env_file:
      - .env
    environment:
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USER: ${POSTGRES_USER:-isp}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-isp}
      DATABASE_NAME: ${POSTGRES_DB:-isp_control}
      REDIS_HOST: redis
      REDIS_PORT: 6379
    volumes:
      - ./apps/api/src:/app/apps/api/src
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_started
    command: ["npm", "run", "seed"]
    restart: "no"

  whatsapp-baileys:
    build:
      context: .
      dockerfile: apps/whatsapp-baileys/Dockerfile.dev
    container_name: isp-control-whatsapp-baileys
    restart: unless-stopped
    networks: [isp_net]
    env_file:
      - .env
    environment:
      PORT: 3101
      WHATSAPP_BAILEYS_SECRET: ${WHATSAPP_BAILEYS_SECRET:-dev-wa-secret-change-me}
      WHATSAPP_SESSIONS_DIR: /data/sessions
      API_INTERNAL_URL: http://api:3000/api
    volumes:
      - ./apps/whatsapp-baileys/src:/app/apps/whatsapp-baileys/src
      - wa_sessions_data:/data/sessions
    expose:
      - "3101"
    depends_on:
      - api

volumes:
  wa_sessions_data:
