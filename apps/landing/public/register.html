<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Crea tu cuenta en ISP Control: empresa, plan y usuario dueño."
    />
    <meta name="theme-color" content="#070d18" />
    <title>Registrarse — ISP Control</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Sora:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />
    <script src="/config.js" defer></script>
    <script src="/register.js" defer></script>
  </head>
  <body class="page-register">
    <div class="atmosphere" aria-hidden="true">
      <div class="atmosphere-grid"></div>
      <div class="atmosphere-fade"></div>
    </div>

    <header class="top">
      <a class="brand" href="/" aria-label="ISP Control">
        <img
          src="/branding/isp-control-logo.png"
          alt="ISP Control"
          class="brand-logo"
          height="36"
        />
      </a>
      <nav class="nav">
        <a href="/#planes">Planes</a>
        <a class="nav-ghost" id="nav-login" href="#">Entrar</a>
      </nav>
    </header>

    <main class="register-main">
      <div class="register-shell">
        <header class="register-intro">
          <p class="register-kicker">Crear cuenta</p>
          <h1>Registra tu ISP</h1>
          <p class="lede">
            Completa los datos de la empresa y del dueño. El plan queda activo
            al crear la cuenta; luego entras al panel con tu email.
          </p>
        </header>

        <form id="register-form" class="register-form" novalidate>
          <fieldset class="register-block">
            <legend>Plan</legend>
            <label class="field">
              <span>Plan elegido</span>
              <select id="planCode" name="planCode" required>
                <option value="">Cargando planes…</option>
              </select>
            </label>
            <p id="plan-hint" class="field-hint" hidden></p>
          </fieldset>

          <fieldset class="register-block">
            <legend>Empresa</legend>
            <label class="field">
              <span>Nombre de la empresa</span>
              <input
                id="name"
                name="name"
                required
                minlength="2"
                maxlength="120"
                autocomplete="organization"
                placeholder="Acme Telecom"
              />
            </label>
            <label class="field">
              <span>Razón social</span>
              <input
                id="legalName"
                name="legalName"
                required
                minlength="2"
                maxlength="180"
                placeholder="Acme Telecom C.A."
              />
            </label>
            <div class="field-row">
              <label class="field">
                <span>Teléfono</span>
                <input
                  id="phone"
                  name="phone"
                  required
                  minlength="7"
                  maxlength="40"
                  autocomplete="tel"
                  placeholder="+58 212 5551234"
                />
              </label>
              <label class="field">
                <span>Slug (identificador)</span>
                <input
                  id="slug"
                  name="slug"
                  required
                  minlength="2"
                  maxlength="60"
                  pattern="[a-z0-9]+(?:-[a-z0-9]+)*"
                  spellcheck="false"
                  placeholder="acme-telecom"
                />
              </label>
            </div>
            <label class="field">
              <span>Dirección</span>
              <input
                id="address"
                name="address"
                required
                minlength="5"
                maxlength="255"
                autocomplete="street-address"
                placeholder="Av. Principal, Ciudad"
              />
            </label>
          </fieldset>

          <fieldset class="register-block">
            <legend>Usuario dueño</legend>
            <label class="field">
              <span>Nombre</span>
              <input
                id="ownerName"
                name="ownerName"
                required
                minlength="2"
                maxlength="120"
                autocomplete="name"
              />
            </label>
            <label class="field">
              <span>Email</span>
              <input
                id="ownerEmail"
                name="ownerEmail"
                type="email"
                required
                autocomplete="email"
              />
            </label>
            <div class="field-row">
              <label class="field">
                <span>Contraseña</span>
                <input
                  id="ownerPassword"
                  name="ownerPassword"
                  type="password"
                  required
                  minlength="8"
                  maxlength="72"
                  autocomplete="new-password"
                />
              </label>
              <label class="field">
                <span>Confirmar contraseña</span>
                <input
                  id="ownerPasswordConfirm"
                  name="ownerPasswordConfirm"
                  type="password"
                  required
                  minlength="8"
                  maxlength="72"
                  autocomplete="new-password"
                />
              </label>
            </div>
          </fieldset>

          <!-- Honeypot: oculto para humanos -->
          <label class="hp" aria-hidden="true">
            <span>Sitio web</span>
            <input
              type="text"
              name="website"
              id="website"
              tabindex="-1"
              autocomplete="off"
            />
          </label>

          <p id="register-error" class="register-error" hidden></p>

          <div class="register-actions">
            <a class="btn ghost" href="/#planes">Volver a planes</a>
            <button type="submit" class="btn primary" id="register-submit">
              Crear cuenta
            </button>
          </div>
        </form>
      </div>
    </main>

    <footer class="foot register-foot">
      <p id="year"></p>
      <a id="foot-login" href="#">¿Ya tienes cuenta? Entrar</a>
    </footer>
  </body>
</html>
