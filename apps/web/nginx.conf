server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Portal cautivo en el dominio del panel (PUBLIC_WEB_URL/{slug}/suspension).
    # La API pública va en su propio subdominio; aquí solo este path interno.
    location ~ ^/([A-Za-z0-9_-]+)/suspension/?$ {
        proxy_pass http://api:3000/api/public/suspension-portal/$1;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store";
    }

    # SPA (API en VITE_API_URL / subdominio api.* — sin proxy /api aquí)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
