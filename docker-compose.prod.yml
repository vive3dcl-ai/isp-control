# ISP Control — producción (imágenes Docker Hub)
#
# Namespace público: dubidubidu
#   dubidubidu/isp-control-api
#   dubidubidu/isp-control-web
#   dubidubidu/isp-control-landing
#   dubidubidu/isp-control-whatsapp-baileys
#
# En el servidor:
#   1) cp .env.production.example .env.production  # o copia el tuyo
#   2) Ajusta dominios / secretos
#   3) docker compose -f docker-compose.prod.yml --env-file .env.production pull
#   4) docker compose -f docker-compose.prod.yml --env-file .env.production up -d
#   5) Seed (requiere repo o imagen api con tools): npm run docker:seed:prod
#
# Publicar imágenes (desde la máquina de build, con docker login):
#   npm run docker:hub:push
#
# Reverse proxy:
#   panel.* → WEB_PORT | api.* → API_PORT | landing → LANDING_PORT
#   vpn.*   → VPN_PORT_* (concentrador externo)

name: isp-control

services:
  postgres:
    image: postgres:16-alpine
    container_name: isp-control-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: isp-control-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    image: ${DOCKERHUB_USER:-dubidubidu}/isp-control-api:${IMAGE_TAG:-latest}
    container_name: isp-control-api
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      DATABASE_HOST: postgres
      DATABASE_PORT: "5432"
      DATABASE_USER: ${POSTGRES_USER}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      DATABASE_NAME: ${POSTGRES_DB}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      PORT: "3000"
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
      CORS_ORIGINS: ${CORS_ORIGINS}
      PUBLIC_API_URL: ${PUBLIC_API_URL}
      PUBLIC_WEB_URL: ${PUBLIC_WEB_URL}
      VPN_PUBLIC_HOST: ${VPN_PUBLIC_HOST:-}
      VPN_PORT_OPENVPN_TCP: ${VPN_PORT_OPENVPN_TCP:-1194}
      VPN_PORT_OPENVPN_UDP: ${VPN_PORT_OPENVPN_UDP:-1195}
      VPN_PORT_WIREGUARD: ${VPN_PORT_WIREGUARD:-51820}
      VPN_WIREGUARD_SERVER_PUBLIC_KEY: ${VPN_WIREGUARD_SERVER_PUBLIC_KEY:-}
      VPN_WIREGUARD_SERVER_PRIVATE_KEY: ${VPN_WIREGUARD_SERVER_PRIVATE_KEY:-}
      WHATSAPP_BAILEYS_URL: http://whatsapp-baileys:3101
      WHATSAPP_BAILEYS_SECRET: ${WHATSAPP_BAILEYS_SECRET}
      WHATSAPP_GRAPH_API_VERSION: ${WHATSAPP_GRAPH_API_VERSION:-v23.0}
    ports:
      - "${API_PORT}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    image: ${DOCKERHUB_USER:-dubidubidu}/isp-control-web:${IMAGE_TAG:-latest}
    container_name: isp-control-web
    restart: unless-stopped
    ports:
      - "${WEB_PORT}:80"
    depends_on:
      - api

  landing:
    image: ${DOCKERHUB_USER:-dubidubidu}/isp-control-landing:${IMAGE_TAG:-latest}
    container_name: isp-control-landing
    restart: unless-stopped
    ports:
      - "${LANDING_PORT}:80"
    environment:
      PANEL_URL: ${PANEL_URL}

  whatsapp-baileys:
    image: ${DOCKERHUB_USER:-dubidubidu}/isp-control-whatsapp-baileys:${IMAGE_TAG:-latest}
    container_name: isp-control-whatsapp-baileys
    restart: unless-stopped
    environment:
      PORT: "3101"
      WHATSAPP_BAILEYS_SECRET: ${WHATSAPP_BAILEYS_SECRET}
      WHATSAPP_SESSIONS_DIR: /data/sessions
      API_INTERNAL_URL: http://api:3000/api
    volumes:
      - wa_sessions_data:/data/sessions
    expose:
      - "3101"
    depends_on:
      - api

  # Seed: construye desde el repo (no está en la imagen slim de API).
  seed:
    build:
      context: .
      dockerfile: apps/api/Dockerfile.dev
    container_name: isp-control-seed
    profiles: ["seed"]
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      DATABASE_HOST: postgres
      DATABASE_PORT: "5432"
      DATABASE_USER: ${POSTGRES_USER}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      DATABASE_NAME: ${POSTGRES_DB}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_started
    command: ["npm", "run", "seed"]
    restart: "no"

volumes:
  postgres_data:
  redis_data:
  wa_sessions_data:
